; NFCNoisy — TinyC6 + PN532 SPI + MAX98357A + SD
; Arduino-ESP32 3.x (C6 + ESP_I2S). Same platform pin as c3-mini-bot.

[platformio]
default_envs = esp32dev_nfcnoisy

[env]
platform = espressif32@55.3.36
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.6/esp32-core-3.3.6.tar.xz
    platformio/framework-arduinoespressif32-libs@https://github.com/espressif/arduino-esp32/releases/download/3.3.6/esp32-core-3.3.6-libs.tar.xz
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

[env:um_tinyc6]
board = um_tinyc6
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101
upload_speed = 460800
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:um_tinyc6_i2c_read]
extends = env:um_tinyc6
build_src_filter =
    +<i2c_read.cpp>

[env:um_tinyc6_i2c_scan]
extends = env:um_tinyc6
build_src_filter =
    +<i2c_scan.cpp>

[env:um_tinyc6_pn532_probe]
extends = env:um_tinyc6
build_src_filter =
    +<pn532_probe.cpp>
lib_deps =
    adafruit/Adafruit PN532 @ ^1.3.4

[env:um_tinyc6_nfcnoisy]
extends = env:um_tinyc6
build_src_filter =
    +<*>
    -<i2c_scan.cpp>
    -<i2c_read.cpp>
    -<pn532_probe.cpp>
    -<hsu_probe.cpp>
lib_deps =
    adafruit/Adafruit PN532 @ ^1.3.4

[env:esp32dev_nfcnoisy]
board = esp32dev
upload_port = /dev/cu.SLAB_USBtoUART
monitor_port = /dev/cu.SLAB_USBtoUART
upload_speed = 460800
build_src_filter =
    +<*>
    -<i2c_scan.cpp>
    -<i2c_read.cpp>
    -<pn532_probe.cpp>
    -<hsu_probe.cpp>
lib_deps =
    adafruit/Adafruit PN532 @ ^1.3.4

; Classic ESP32 UART2 GetFirmwareVersion. HSU switches both OFF.
; ESP GPIO17 TX -> PN532 RXD, GPIO16 RX -> PN532 TXD (same holes as I2C).
[env:esp32dev_hsu_probe]
board = esp32dev
upload_speed = 460800
build_src_filter =
    +<hsu_probe.cpp>

; Classic ESP32 DevKit ("ESP32-S" / WROOM). UART USB-serial, not native USB.
; Wire PN532 I2C: SDA GPIO21, SCL GPIO22, VCC 3.3V, GND, RSTPDN to 3.3V.
[env:esp32dev_pn532_probe]
board = esp32dev
upload_speed = 460800
build_src_filter =
    +<pn532_probe.cpp>
build_flags =
  -DPROBE_SDA=21
  -DPROBE_SCL=22
lib_deps =
    adafruit/Adafruit PN532 @ ^1.3.4

; ESP32-S3 DevKitC (native USB CDC). SDA 8 / SCL 9.
[env:esp32s3_pn532_probe]
board = esp32-s3-devkitc-1
upload_speed = 460800
build_src_filter =
    +<pn532_probe.cpp>
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DPROBE_SDA=8
  -DPROBE_SCL=9
lib_deps =
    adafruit/Adafruit PN532 @ ^1.3.4
