; NFCNoisy — PN532 SPI + MAX98357A I2S + SD
; Arduino-ESP32 3.3.6 via pioarduino (ESP32-C6, classic ESP32, FeatherS3).

[platformio]
default_envs = um_feathers3_nfcnoisy

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.6/esp32-core-3.3.6.tar.xz
    platformio/framework-arduinoespressif32-libs@https://github.com/espressif/arduino-esp32/releases/download/3.3.6/esp32-core-3.3.6-libs.tar.xz
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -Iinclude
lib_deps =
    adafruit/Adafruit PN532 @ ^1.3.4

[env:um_tinyc6]
board = um_tinyc6
upload_speed = 460800
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DNFCNOISY_BOARD_TINYC6

[env:um_tinyc6_i2c_read]
extends = env:um_tinyc6
build_src_filter =
    +<i2c_read.cpp>

[env:um_tinyc6_i2c_scan]
extends = env:um_tinyc6
build_src_filter =
    +<i2c_scan.cpp>

[env:um_tinyc6_pn532_probe]
extends = env:um_tinyc6
build_src_filter =
    +<pn532_probe.cpp>

[env:um_tinyc6_nfcnoisy]
extends = env:um_tinyc6
build_src_filter =
    +<*>
    -<i2c_scan.cpp>
    -<i2c_read.cpp>
    -<pn532_probe.cpp>
    -<hsu_probe.cpp>
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit NeoPixel @ ^1.12.0

[env:esp32dev_nfcnoisy]
board = esp32dev
upload_speed = 460800
build_src_filter =
    +<*>
    -<i2c_scan.cpp>
    -<i2c_read.cpp>
    -<pn532_probe.cpp>
    -<hsu_probe.cpp>

; --- Unexpected Maker FeatherS3 (ESP32-S3, 16 MB flash, 8 MB OPI PSRAM) ---

[env:um_feathers3]
board = um_feathers3
upload_speed = 460800
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DNFCNOISY_BOARD_FEATHERS3
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_16MB_ota.csv

[env:um_feathers3_i2c_scan]
extends = env:um_feathers3
build_src_filter =
    +<i2c_scan.cpp>
build_flags =
    ${env:um_feathers3.build_flags}
    -DSCAN_SDA=8
    -DSCAN_SCL=9

[env:um_feathers3_pn532_probe]
extends = env:um_feathers3
build_src_filter =
    +<pn532_probe.cpp>
build_flags =
    ${env:um_feathers3.build_flags}
    -DPROBE_SDA=8
    -DPROBE_SCL=9

[env:um_feathers3_nfcnoisy]
extends = env:um_feathers3
build_src_filter =
    +<*>
    -<i2c_scan.cpp>
    -<i2c_read.cpp>
    -<pn532_probe.cpp>
    -<hsu_probe.cpp>
build_flags =
    ${env:um_feathers3.build_flags}
    -DNFCNOISY_WIFI_OTA

; OTA upload: export OTA_UPLOAD_PASSWORD (same as OTA_PASSWORD in secrets.h)
[env:um_feathers3_nfcnoisy_ota]
extends = env:um_feathers3_nfcnoisy
upload_protocol = espota
upload_port = nfcnoisy.local
upload_flags =
    --auth=${sysenv.OTA_UPLOAD_PASSWORD}

; Classic ESP32 UART2 HSU probe
[env:esp32dev_hsu_probe]
board = esp32dev
upload_speed = 460800
build_src_filter =
    +<hsu_probe.cpp>

[env:esp32dev_pn532_probe]
board = esp32dev
upload_speed = 460800
build_src_filter =
    +<pn532_probe.cpp>
build_flags =
    ${env.build_flags}
    -DPROBE_SDA=21
    -DPROBE_SCL=22

[env:esp32s3_pn532_probe]
board = esp32-s3-devkitc-1
upload_speed = 460800
build_src_filter =
    +<pn532_probe.cpp>
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPROBE_SDA=8
    -DPROBE_SCL=9
